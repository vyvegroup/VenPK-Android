name: VenPK Build & Release

on:
  push:
    branches: [ main, master ]
    tags: ['v*']
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g., v1.0.0)'
        required: false
        default: 'v1.0.0'

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'
  ANDROID_API_LEVEL: 34
  NDK_VERSION: '26.1.10909125'
  CMAKE_VERSION: '3.22.1'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}

      - name: Setup NDK
        run: |
          echo "y" | sdkmanager --install "ndk;${{ env.NDK_VERSION }}"
          echo "y" | sdkmanager --install "cmake;${{ env.CMAKE_VERSION }}"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Step 1: Build the source app module first
      - name: Build source app module
        run: |
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      # Step 1b: Verify DEX files were produced
      - name: Verify DEX output
        run: |
          echo "=== Searching for DEX files in app/build ==="
          find app/build -name "classes*.dex" -type f 2>/dev/null | head -20 || echo "NO DEX FILES FOUND"
          echo ""
          echo "=== DEX directory listing ==="
          find app/build/intermediates/dex -type f -name "*.dex" 2>/dev/null | head -20 || echo "No DEX in intermediates/dex"
          echo ""
          echo "=== app/build intermediates structure ==="
          find app/build/intermediates -type d -maxdepth 4 2>/dev/null | head -30 || echo "No intermediates dir"

      # Step 2: Encrypt the app module DEX files using VenPK engine
      - name: Encrypt DEX with VenPK engine
        run: |
          echo "=== Running VenPK DEX encryption ==="
          ./gradlew :loader:venpkPrepareAssets --no-daemon --stacktrace --info 2>&1 | tee encrypt-log.txt

      # Step 2b: HARD VERIFY - payload MUST exist
      - name: Verify encrypted payload (MUST SUCCEED)
        run: |
          echo "=== Checking for encrypted payload ==="
          if [ -f "loader/src/main/assets/venpk_payload.bin" ]; then
            SIZE=$(stat -c%s "loader/src/main/assets/venpk_payload.bin")
            echo "✅ Payload found: $SIZE bytes"
            echo ""
            # Verify VPK1 header
            HEADER=$(xxd -l 4 -p "loader/src/main/assets/venpk_payload.bin")
            echo "Header: $HEADER"
            if [ "$HEADER" != "56504b31" ]; then
              echo "❌ ERROR: Invalid payload header! Expected VPK1"
              exit 1
            fi
            echo "✅ Payload header valid (VPK1)"
          else
            echo "❌ FATAL: Payload file not found at loader/src/main/assets/venpk_payload.bin"
            echo "The VenPK encryption step failed to produce the payload."
            echo "Check the encrypt-log.txt for details."
            exit 1
          fi

      # Step 2c: Create assets placeholder if missing
      - name: Ensure assets directory exists
        run: |
          mkdir -p loader/src/main/assets
          # Double check the payload is there
          test -f loader/src/main/assets/venpk_payload.bin

      # Step 3: Build the loader APK (with encrypted payload in assets)
      - name: Build VenPK loader (protected APK)
        run: |
          ./gradlew :loader:assembleRelease --no-daemon --stacktrace

      # Step 4: Verify APK contains payload
      - name: Verify APK contains encrypted payload
        run: |
          APK_PATH=$(find loader/build/outputs/apk/release -name "*.apk" | head -1)
          echo "Found APK: $APK_PATH"
          if [ -z "$APK_PATH" ]; then
            echo "❌ ERROR: APK not found!"
            find loader/build/ -type f -name "*.apk" 2>/dev/null || true
            exit 1
          fi

          # List assets inside the APK to verify payload is included
          echo "=== Assets in APK ==="
          unzip -l "$APK_PATH" | grep -E "assets/|venpk_payload" || echo "No assets found in APK"

          # Check specifically for the payload
          if unzip -l "$APK_PATH" | grep -q "venpk_payload.bin"; then
            echo "✅ Encrypted payload is inside the APK"
          else
            echo "❌ FATAL: venpk_payload.bin is NOT inside the APK!"
            exit 1
          fi

          cp "$APK_PATH" app-unsigned.apk
          ls -la app-unsigned.apk

      # Step 5: Generate signing keystore
      - name: Generate signing keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'venpk2024secure' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'venpk' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'venpk2024secure' }}
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Using existing keystore from secrets"
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          else
            echo "Generating new signing keystore"
            keytool -genkeypair \
              -v \
              -keystore release.keystore \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 4096 \
              -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -dname "CN=VenPK, OU=VenPK Security, O=VenPK, L=Unknown, ST=Unknown, C=VN"
          fi

      # Step 6: Sign APK with apksigner (v1 + v2 + v3 signing)
      - name: Sign APK (v1 + v2 + v3)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'venpk2024secure' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'venpk' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'venpk2024secure' }}
        run: |
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)
          echo "Using build tools: $BUILD_TOOLS"

          $BUILD_TOOLS/apksigner sign \
            --ks release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out app-release-signed.apk \
            app-unsigned.apk

          echo "APK signed successfully"

          echo "--- Signature Verification ---"
          $BUILD_TOOLS/apksigner verify --print-certs -v app-release-signed.apk

      # Step 7: Determine release tag
      - name: Determine release tag
        id: release_tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.release_tag }}" ]]; then
            TAG="${{ github.event.inputs.release_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TIMESTAMP=$(date +%Y%m%d-%H%M%S)
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            TAG="v1.0.0-${TIMESTAMP}-${SHORT_SHA}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Release tag: $TAG"

      # Step 8: Create GitHub Release
      - name: Create Release and Upload
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: "VenPK Release ${{ steps.release_tag.outputs.tag }}"
          body: |
            ## VenPK Protected Android App

            ### Build Info
            - **Commit**: `${{ github.sha }}`
            - **Branch**: `${{ github.ref_name }}`
            - **Trigger**: `${{ github.event_name }}`
            - **Build Date**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')

            ### Protection Features
            - ✅ AES-256-GCM DEX encryption
            - ✅ In-memory DEX loading (zero disk write)
            - ✅ Native crypto engine (C++)
            - ✅ Anti-debug, anti-frida, anti-emulator
            - ✅ APK integrity verification
            - ✅ APK signed with v1 + v2 + v3

            ### Installation
            1. Download `VenPK-release.apk`
            2. Enable "Install from unknown sources"
            3. Install and run

            > ⚠️ This APK is protected by VenPK Engine.
            > Decompiling will not reveal the original source code.
          files: |
            app-release-signed.apk
          draft: false
          prerelease: ${{ contains(steps.release_tag.outputs.tag, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      # Step 9: Upload artifact
      - name: Upload signed APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: VenPK-signed-apk
          path: app-release-signed.apk
          retention-days: 30

      # Step 10: Build summary
      - name: Build Summary
        run: |
          echo "## VenPK Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Tag** | \`${{ steps.release_tag.outputs.tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Signing** | v1 + v2 + v3 ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| **Protection** | VenPK Engine ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| **Payload** | Embedded ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### APK Size" >> $GITHUB_STEP_SUMMARY
          ls -lh app-release-signed.apk | awk '{print "Signed APK: " $5}' >> $GITHUB_STEP_SUMMARY
